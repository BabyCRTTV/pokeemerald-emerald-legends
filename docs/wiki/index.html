<style>
:root{color-scheme:light;--bg:#f8f5ff;--card:#fff;--pale:#eee6fc;--border:#dcd0ee;--ink:#2f2840;--muted:#686079;--accent:#7553a7;--dark:#4b3477;--focus:#4e3794}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:#65459a}a:hover{text-decoration-thickness:2px}
button,input{font:inherit}.top{background:rgba(251,249,255,.98);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;box-shadow:0 2px 13px #4429660b}
.top-inner{max-width:1380px;margin:auto;min-height:70px;padding:11px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--dark);font-size:17px;font-weight:800;letter-spacing:-.45px}.mark{display:grid;place-items:center;flex:none;width:38px;height:38px;background:#dcccfa;border:2px solid #b3a0d7;border-radius:12px;font-size:22px}.navlinks{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}.pill,.navlinks a,.navlinks button{padding:7px 12px;border-radius:10px;border:1px solid transparent;color:var(--dark);font-weight:650;text-decoration:none;background:none;cursor:pointer;font-size:13px}.navlinks a:hover,.navlinks button:hover{background:#ebe3f8}.navlinks .apk{background:var(--dark);color:#fff}.navlinks .apk:hover{background:#634991}
.layout{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr) 185px;gap:26px;padding:24px 22px 60px}.sidebar{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:16px;height:calc(100vh - 125px);overflow-y:auto;position:sticky;top:94px}.sidetitle{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:850;color:#87769e;margin:18px 8px 5px}.sidetitle:first-child{margin-top:0}
.sidebar a{display:block;padding:7px 10px;margin:2px 0;border-radius:9px;text-decoration:none;font-size:13px;font-weight:550;color:var(--muted);line-height:1.3}.sidebar a:hover,.sidebar a.current{background:var(--pale);color:var(--dark)}.sidebar a.current{font-weight:800;box-shadow:inset 3px 0 var(--accent)}main{min-width:0}
.welcome{padding:32px 32px 29px;background:linear-gradient(128deg,#ece1ff,#fcfaff 68%);border:1px solid var(--border);border-radius:20px;margin-bottom:19px}.eyebrow{font-size:12px;color:#7356a0;font-weight:850;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 8px}.welcome h1{font-size:clamp(26px,4vw,41px);line-height:1.18;letter-spacing:-1.4px;margin:0 0 12px}.welcome p{max-width:690px;color:var(--muted);margin:0}.searchrow{display:flex;margin:20px 0 0;align-items:center;gap:8px;background:white;border:1px solid #bba8db;border-radius:12px;padding:4px 12px;max-width:690px;box-shadow:0 4px 14px #6b499311}.searchrow input{width:100%;outline:none;border:0;background:none;color:var(--ink);padding:10px 2px}.searchrow:focus-within{outline:3px solid #b8a3ee}.small{font-size:12px;color:var(--muted)}.results-note{font-size:13px;margin:11px 0 0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{padding:19px 20px;border:1px solid var(--border);border-radius:14px;background:#fff;text-align:left;cursor:pointer;transition:transform .12s,box-shadow .12s;color:inherit}.card:hover{transform:translateY(-2px);box-shadow:0 9px 20px #57417b16}.card strong{display:block;font-size:17px;line-height:1.35;margin:3px 0}.card .kind{font-size:11px;text-transform:uppercase;font-weight:750;color:#906eb9}.card p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.section-head{font-size:13px;letter-spacing:1px;text-transform:uppercase;font-weight:800;color:#755b9a;margin:28px 0 12px}
.article{background:#fff;border:1px solid var(--border);border-radius:18px;padding:clamp(20px,4vw,42px);box-shadow:0 6px 30px #4f36760b}.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:12px;margin:0 0 20px}.crumbs button{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font-weight:700}.article h1{line-height:1.2;letter-spacing:-.8px;font-size:clamp(26px,3vw,36px);margin:0 0 10px}.lede{font-size:16px;color:var(--muted);border-bottom:1px solid #e9e3f2;padding-bottom:22px;margin:0 0 22px}.article h2{font-size:22px;margin:30px 0 10px;line-height:1.3;letter-spacing:-.3px;scroll-margin-top:100px}.article h3{font-size:17px;margin:22px 0 8px;scroll-margin-top:100px}.article p{margin:12px 0}.article ul,.article ol{padding-left:25px}.article li{margin:5px 0}.article code{background:#f4f0fa;padding:2px 4px;border-radius:4px;font-size:13px;word-break:break-all}.article table{width:100%;border-collapse:collapse;font-size:14px;margin:17px 0;min-width:450px}.article th{text-align:left;background:#efe9fa;color:var(--dark)}.article th,.article td{padding:9px 10px;border:1px solid #e4dcf1;vertical-align:top}.scroll-table{overflow-x:auto}.article blockquote{border-left:4px solid #b29bdf;padding:4px 14px;background:#f6f2fc;margin:16px 0}.articlefooter{display:flex;gap:8px;flex-wrap:wrap;margin-top:32px;padding-top:18px;border-top:1px solid var(--border)}.action{border:1px solid var(--border);background:#f8f4ff;border-radius:9px;color:var(--dark);font-weight:700;font-size:13px;padding:8px 12px;cursor:pointer}.action:hover{background:#ede4fa}
.right{position:sticky;top:100px;align-self:start;font-size:13px;color:var(--muted)}.right strong{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}.right a{display:block;text-decoration:none;color:#76658c;border-left:2px solid var(--border);padding:5px 9px}.right a:hover{color:var(--accent);border-left-color:var(--accent)}
footer{max-width:1380px;margin:auto;padding:0 22px 32px;font-size:12px;color:var(--muted)}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
#menu{display:none}@media(max-width:1150px){.layout{grid-template-columns:235px minmax(0,1fr)}.right{display:none}}@media(max-width:750px){.top-inner{padding:9px 14px;gap:7px}.brand{font-size:14px}.mark{width:32px;height:32px;font-size:18px}.navlinks{width:100%;gap:1px;margin:0}.navlinks a,.navlinks button{padding:6px 9px;font-size:12px}#menu{display:block}.layout{display:block;padding:15px 12px 40px}.sidebar{position:fixed;z-index:12;top:118px;bottom:0;left:0;transform:translateX(-105%);transition:transform .2s;width:min(300px,85vw);height:auto;box-shadow:8px 0 25px #3a295744}.sidebar.open{transform:translateX(0)}.welcome{padding:24px 19px}.cards{grid-template-columns:1fr}.article{padding:23px 19px}.article table{font-size:12px}.welcome h1{font-size:29px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
