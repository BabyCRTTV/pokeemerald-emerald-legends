name: Recover verified Wyrmtide preview
on:
  push:
    branches: [ codex/wyrmtide-isle ]
    paths: [ '.github/workflows/wyrmtide-preview-recovery.yml' ]
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Recover exact native PNGs after matching emulator checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: BabyCRTTV/pokeemerald-emerald-legends
          NATIVE_RUN: '42077224680'
          NATIVE_HEAD: '733d93908d203f2ded6b8d182c98269232349472'
        run: |
          python3 - <<'PY'
          import os,time,json,urllib.request,hashlib,zipfile,io,base64
          api='https://api.github.com/repos/'+os.environ['REPO']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Legends-native-preview'}
          class SignedRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  new=super().redirect_request(req,fp,code,msg,hdrs,newurl)
                  if new is not None: new.remove_header('Authorization')
                  return new
          opener=urllib.request.build_opener(SignedRedirect)
          def req(path):
              return opener.open(urllib.request.Request(api+path,headers=headers),timeout=30).read()
          run_id=os.environ['NATIVE_RUN'];expected=os.environ['NATIVE_HEAD']
          for _ in range(150):
              run=json.loads(req('/actions/runs/'+run_id))
              assert run['head_sha']==expected and run['head_branch']=='codex/wyrmtide-isle'
              if run['status']=='completed':
                  assert run['conclusion']=='success', 'Matching native run failed: '+str(run['conclusion'])
                  break
              print('Waiting for matching native checks:',run['status'],flush=True);time.sleep(8)
          else: raise AssertionError('Native run did not finish')
          arts=json.loads(req('/actions/runs/'+run_id+'/artifacts'))['artifacts']
          art=next(a for a in arts if a['name']=='legends-mgba-gameplay' and not a['expired'])
          raw=req('/actions/artifacts/'+str(art['id'])+'/zip')
          assert 'sha256:'+hashlib.sha256(raw).hexdigest()==art['digest']
          z=zipfile.ZipFile(io.BytesIO(raw));names=z.namelist()
          assert not any(n.lower().endswith(('.gba','.elf','.sav','.srm')) for n in names)
          def native(name):
              found=[n for n in names if n.endswith('wyrmtide-native/'+name)]
              assert len(found)==1,(name,found)
              return z.read(found[0])
          proof=json.loads(native('verification.json'))
          assert proof['passed'] and not proof['scenesOnly']
          for name in ['05-second-landing.png','26-tidal-pool.png','27-tidal-pool-animation.png','08-slumbering-regidrago.png']:
              image=native(name);assert hashlib.sha256(image).hexdigest()==proof['images'][name]
              print('NATIVE_PNG:'+name+':'+base64.b64encode(image).decode(),flush=True)
          print('NATIVE_RECEIPT:'+base64.b64encode(json.dumps({'source':expected,'run':run_id,'artifact':art,'native':proof}).encode()).decode(),flush=True)
          PY
