name: Legends project checks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  project-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Legends project metadata
        run: |
          test -f VERSION
          test -f ROADMAP.md
          test -f CHANGELOG.md
          test -f docs/index.html
          grep -q "0.1.0-dev" VERSION
