name: Legends project checks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  project-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise browser patcher regression tests
        run: node --test test/legends-patcher.test.cjs
      - name: Exercise seasonal engine regression tests
        run: python3 test/legends-seasons.test.py
      - name: Exercise dynamic weather regression tests
        run: python3 test/legends-weather.test.py
      - name: Exercise starter and rival regression tests
        run: python3 test/legends-starters.test.py
      - name: Exercise Options navigation regression tests
        run: python3 test/legends-options-navigation.test.py
      - name: Exercise Options text regression tests
        run: python3 test/legends-options-text.test.py
      - name: Exercise New Game Options regression tests
        run: python3 test/legends-new-game-options.test.py
      - name: Exercise native follower regression tests
        run: python3 test/legends-followers.test.py
      - name: Exercise upstream held-item integration
        run: python3 test/legends-upstream-items.test.py
      - name: Exercise pause panel regression tests
        run: python3 test/legends-start-menu.test.py
      - name: Exercise player appearance regression tests
        run: python3 test/legends-appearance.test.py
      - name: Exercise visual polish regression tests
        run: python3 test/legends-polish.test.py
      - name: Verify player appearance art
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 test/legends-appearance-assets.test.py
      - name: Exercise wardrobe navigation and access
        run: python3 test/legends-wardrobe.test.py
      - name: Verify layered accessories and wardrobe furniture
        run: python3 test/legends-accessory-assets.test.py
      - name: Verify native costume assets and striped Sport shorts
        run: python3 test/legends-costume-assets.test.py
      - name: Exercise Da Bug gift and species integration
        run: python3 test/legends-da-bug.test.py
      - name: Verify Legends project metadata
        run: |
          test -f VERSION
          test -f ROADMAP.md
          test -f CHANGELOG.md
          test -f CHANGELOG-RELEASE.md
          test -f CHANGELOG-DEBUG.md
          test -f docs/index.html
          test -f docs/changelog.html
          test -f docs/VERSIONING.md
          test -f docs/features/options-menu.md
          test -f docs/QA.md
          test -f docs/features/shiny-rate.md
          test -f test/legends-patcher.test.cjs
          test -f include/legends_settings.h
          test -f src/legends_settings.c

          VERSION_NUMBER="$(tr -d '\r\n' < VERSION)"

          echo "$VERSION_NUMBER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'
          grep -Fq "## [$VERSION_NUMBER]" CHANGELOG.md
          grep -Fq "## [$VERSION_NUMBER]" CHANGELOG-RELEASE.md
          grep -Fq "## [$VERSION_NUMBER]" CHANGELOG-DEBUG.md
          grep -m1 '^## \[' CHANGELOG.md | grep -Fq "## [$VERSION_NUMBER]"
          grep -m1 '^## \[' CHANGELOG-RELEASE.md | grep -Fq "## [$VERSION_NUMBER]"
          grep -m1 '^## \[' CHANGELOG-DEBUG.md | grep -Fq "## [$VERSION_NUMBER]"
          grep -Fq "**Version:** $VERSION_NUMBER" README.md
          grep -Fq "LEGENDS v$VERSION_NUMBER" src/option_menu.c
          grep -Fq "LEGENDS v$VERSION_NUMBER-D" src/option_menu.c
          grep -Fq "v$VERSION_NUMBER" docs/index.html
          grep -Fq "v$VERSION_NUMBER" docs/patcher.html
          grep -Fq "const VERSION = \"$VERSION_NUMBER\";" docs/patcher.js
          grep -Fq 'BUILD_SUFFIX = IS_DEBUG ? "-debug" : ""' docs/patcher.js
          grep -Fq "patcher.html?build=debug" docs/index.html
          grep -Fq "changelog.html" docs/index.html
          grep -Fq 'data-tab-target="release"' docs/changelog.html
          grep -Fq 'data-tab-target="debug"' docs/changelog.html
          grep -Fq "v$VERSION_NUMBER" docs/changelog.html
          test "$(grep -Fc "<h2>v$VERSION_NUMBER " docs/changelog.html)" -eq 2
          grep -Fq 'href="changelog.html#release"' docs/index.html
          grep -Fq 'href="changelog.html#debug"' docs/index.html

          grep -Fq '#define I_EXP_SHARE_FLAG        FLAG_LEGENDS_EXP_SHARE' include/config/item.h
          grep -Fq '#define I_EXP_SHARE_ITEM        GEN_6' include/config/item.h
          grep -Fq '#define DEXNAV_ENABLED                TRUE' include/config/dexnav.h
          grep -Fq 'FLAG_LEGENDS_DEXNAV_UNLOCKED' include/config/dexnav.h
          grep -Fq 'FLAG_LEGENDS_DEXNAV_SEARCHING' include/config/dexnav.h
          grep -Fq 'VAR_LEGENDS_DEXNAV_SPECIES' include/config/dexnav.h
          grep -Fq 'VAR_LEGENDS_DEXNAV_STEP_COUNTER' include/config/dexnav.h
          grep -Fq 'LegendsEnsureExpShareKeyItem();' src/new_game.c
          grep -Fq 'LegendsRestoreUnlocksOnContinue();' src/overworld.c
          grep -Fq 'AddBagItem(ITEM_EXP_SHARE, 1);' src/legends_settings.c
          grep -Fq 'CurrentBattlePyramidLocation() == PYRAMID_LOCATION_NONE' src/legends_settings.c
          grep -Fq 'setflag FLAG_LEGENDS_DEXNAV_UNLOCKED' data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc
          grep -Fq '#define FLAG_LEGENDS_EXP_SHARE' include/constants/flags.h
          grep -Fq 'COMPOUND_STRING("EXP SHARE")' src/option_menu.c
          grep -Fq 'COMPOUND_STRING("SHINY RATE")' src/option_menu.c
          grep -Fq 'MENUITEM_SHINYRATE' src/option_menu.c
          grep -Fq 'tShinyRate = LegendsGetShinyRateSetting();' src/option_menu.c
          grep -Fq 'LegendsSetShinyRateSetting(gTasks[taskId].tShinyRate);' src/option_menu.c
          grep -Fq 'VAR_LEGENDS_SHINY_RATE' include/constants/vars.h
          grep -Fq 'return 8192;' src/legends_settings.c
          grep -Fq 'return 5680;' src/legends_settings.c
          grep -Fq 'return 1226;' src/legends_settings.c
          grep -Fq 'SetWildShinyGenerationContext(TRUE);' src/wild_encounter.c
          grep -Fq 'SetWildShinyGenerationContext(FALSE);' src/wild_encounter.c
          grep -Fq 'RollLegendsWildShiny(denominator)' src/pokemon.c
          grep -Fq '(0x10000u / denominator) * denominator' src/pokemon.c
          grep -Fq 'tExpShare = LegendsIsExpShareEnabled() ? 0 : 1;' src/option_menu.c
          grep -Fq 'LegendsSetExpShareEnabled(gTasks[taskId].tExpShare == 0);' src/option_menu.c
          grep -Fq 'LegendsInitNewGameSettings();' src/new_game.c
          grep -Fq 'LegendsRestoreUnlocksOnContinue();' src/overworld.c

          grep -Fq 'OPTION_PAGE_GENERAL' src/option_menu.c
          grep -Fq 'OPTION_PAGE_LEGENDS' src/option_menu.c
          grep -Fq 'COMPOUND_STRING("GENERAL 1/3")' src/option_menu.c
          grep -Fq 'COMPOUND_STRING("LEGENDS 2/3")' src/option_menu.c
          grep -Fq 'JOY_NEW(L_BUTTON)' src/option_menu.c
          grep -Fq 'JOY_NEW(R_BUTTON)' src/option_menu.c
          grep -Fq 'COMPOUND_STRING("NEXT PAGE")' src/option_menu.c
          grep -Fq 'A: NEXT  B: SAVE' src/option_menu.c
          test -f test/legends-options-navigation.test.py
          grep -Fq '#define OPTION_WINDOW_Y       40' src/option_menu.c
          grep -Fq '.tilemapTop = 5' src/option_menu.c
          grep -Fq '.height = 14' src/option_menu.c
          ! grep -Fq '.height = 15' src/option_menu.c

          grep -Fq 'goto_if_set FLAG_DELIVERED_STEVEN_LETTER, RustboroCity_DevonCorp_3F_EventScript_GiveLuckyEgg' data/maps/RustboroCity_DevonCorp_3F/scripts.inc
          grep -Fq 'giveitem ITEM_LUCKY_EGG' data/maps/RustboroCity_DevonCorp_3F/scripts.inc
          grep -Fq 'RustboroCity_DevonCorp_3F_Text_ExplainLuckyEgg' data/maps/RustboroCity_DevonCorp_3F/scripts.inc
          ! grep -Fq 'giveitem ITEM_EXP_SHARE' data/maps/RustboroCity_DevonCorp_3F/scripts.inc


          grep -Fq '#define FLAG_LEGENDS_CHAMPION_RARE_CANDY_REWARD' include/constants/flags.h
          grep -Fq 'setflag FLAG_SYS_NATIONAL_DEX' data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc
          grep -Fq 'special EnableNationalPokedex' data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc
          grep -Fq 'giveitem ITEM_RARE_CANDY, 25' data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc
          grep -Fq 'addpcitem ITEM_RARE_CANDY, 25' data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc
          grep -Fq 'FLAG_LEGENDS_CHAMPION_RARE_CANDY_REWARD' data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc
          ! grep -Fq 'LittlerootTown_ProfessorBirchsLab_EventScript_UpgradeToNationalDex' data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc
