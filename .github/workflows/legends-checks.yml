name: Legends project checks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  project-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise browser patcher regression tests
        run: node --test test/legends-patcher.test.cjs
      - name: Verify Legends project metadata
        run: |
          test -f VERSION
          test -f ROADMAP.md
          test -f CHANGELOG.md
          test -f CHANGELOG-RELEASE.md
          test -f CHANGELOG-DEBUG.md
          test -f docs/index.html
          test -f docs/changelog.html
          test -f docs/VERSIONING.md
          test -f docs/features/options-menu.md
          test -f docs/QA.md
          test -f test/legends-patcher.test.cjs
          test -f include/legends_settings.h
          test -f src/legends_settings.c

          VERSION_NUMBER="$(tr -d '\r\n' < VERSION)"

          echo "$VERSION_NUMBER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'
          grep -Fq "## [$VERSION_NUMBER]" CHANGELOG.md
          grep -Fq "## [$VERSION_NUMBER]" CHANGELOG-RELEASE.md
          grep -Fq "## [$VERSION_NUMBER]" CHANGELOG-DEBUG.md
          grep -m1 '^## \[' CHANGELOG.md | grep -Fq "## [$VERSION_NUMBER]"
          grep -m1 '^## \[' CHANGELOG-RELEASE.md | grep -Fq "## [$VERSION_NUMBER]"
          grep -m1 '^## \[' CHANGELOG-DEBUG.md | grep -Fq "## [$VERSION_NUMBER]"
          grep -Fq "**Version:** $VERSION_NUMBER" README.md
          grep -Fq "LEGENDS v$VERSION_NUMBER" src/option_menu.c
          grep -Fq "LEGENDS v$VERSION_NUMBER-D" src/option_menu.c
          grep -Fq "v$VERSION_NUMBER" docs/index.html
          grep -Fq "v$VERSION_NUMBER" docs/patcher.html
          grep -Fq "const VERSION = \"$VERSION_NUMBER\";" docs/patcher.js
          grep -Fq 'BUILD_SUFFIX = IS_DEBUG ? "-debug" : ""' docs/patcher.js
          grep -Fq "patcher.html?build=debug" docs/index.html
          grep -Fq "changelog.html" docs/index.html
          grep -Fq 'data-tab-target="release"' docs/changelog.html
          grep -Fq 'data-tab-target="debug"' docs/changelog.html
          grep -Fq "v$VERSION_NUMBER" docs/changelog.html
          test "$(grep -Fc "<h2>v$VERSION_NUMBER " docs/changelog.html)" -eq 2
          grep -Fq 'href="changelog.html#release"' docs/index.html
          grep -Fq 'href="changelog.html#debug"' docs/index.html

          grep -Fq '#define I_EXP_SHARE_FLAG        FLAG_LEGENDS_EXP_SHARE' include/config/item.h
          grep -Fq '#define FLAG_LEGENDS_EXP_SHARE' include/constants/flags.h
          grep -Fq 'COMPOUND_STRING("EXP SHARE")' src/option_menu.c
          grep -Fq 'tExpShare = LegendsIsExpShareEnabled() ? 0 : 1;' src/option_menu.c
          grep -Fq 'LegendsSetExpShareEnabled(gTasks[taskId].tExpShare == 0);' src/option_menu.c
          grep -Fq 'LegendsInitNewGameSettings();' src/new_game.c
          grep -Fq 'LegendsEnsureSettingsInitialized();' src/overworld.c

          grep -Fq 'OPTION_PAGE_GENERAL' src/option_menu.c
          grep -Fq 'OPTION_PAGE_LEGENDS' src/option_menu.c
          grep -Fq 'COMPOUND_STRING("GENERAL 1/2")' src/option_menu.c
          grep -Fq 'COMPOUND_STRING("LEGENDS 2/2")' src/option_menu.c
          grep -Fq 'JOY_NEW(L_BUTTON)' src/option_menu.c
          grep -Fq 'JOY_NEW(R_BUTTON)' src/option_menu.c
          grep -Fq 'hintRight + 4 <= versionStart' src/option_menu.c
          grep -Fq '#define OPTION_WINDOW_Y       40' src/option_menu.c
          grep -Fq '.tilemapTop = 5' src/option_menu.c
          grep -Fq '.height = 14' src/option_menu.c
          ! grep -Fq '.height = 15' src/option_menu.c

          grep -Fq 'goto_if_set FLAG_DELIVERED_STEVEN_LETTER, RustboroCity_DevonCorp_3F_EventScript_GiveLuckyEgg' data/maps/RustboroCity_DevonCorp_3F/scripts.inc
          grep -Fq 'giveitem ITEM_LUCKY_EGG' data/maps/RustboroCity_DevonCorp_3F/scripts.inc
          grep -Fq 'RustboroCity_DevonCorp_3F_Text_ExplainLuckyEgg' data/maps/RustboroCity_DevonCorp_3F/scripts.inc
          ! grep -Fq 'giveitem ITEM_EXP_SHARE' data/maps/RustboroCity_DevonCorp_3F/scripts.inc


          grep -Fq '#define FLAG_LEGENDS_CHAMPION_RARE_CANDY_REWARD' include/constants/flags.h
          grep -Fq 'setflag FLAG_SYS_NATIONAL_DEX' data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc
          grep -Fq 'special EnableNationalPokedex' data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc
          grep -Fq 'giveitem ITEM_RARE_CANDY, 25' data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc
          grep -Fq 'addpcitem ITEM_RARE_CANDY, 25' data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc
          grep -Fq 'FLAG_LEGENDS_CHAMPION_RARE_CANDY_REWARD' data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc
          ! grep -Fq 'LittlerootTown_ProfessorBirchsLab_EventScript_UpgradeToNationalDex' data/maps/LittlerootTown_ProfessorBirchsLab/scripts.inc
