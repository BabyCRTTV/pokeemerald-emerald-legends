name: Build release patches

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build-release-patch.yml'
      - 'VERSION'
      - 'src/**'
      - 'include/**'
      - 'data/**'
      - 'graphics/**'
      - 'sound/**'
      - 'maps/**'
      - 'scripts/**'
      - 'Makefile'
      - 'make_tools.mk'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/build-release-patch.yml'
      - 'VERSION'
      - 'src/**'
      - 'include/**'
      - 'data/**'
      - 'graphics/**'
      - 'sound/**'
      - 'maps/**'
      - 'scripts/**'
      - 'Makefile'
      - 'make_tools.mk'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legends-release-patch
  cancel-in-progress: true

jobs:
  build-patches:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout Emerald Legends
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            git \
            libpng-dev \
            python3 \
            g++

      - name: Build Emerald Legends Debug
        run: make -j"$(nproc)"

      - name: Build Emerald Legends Release
        run: make -j"$(nproc)" release

      - name: Build matching vanilla Pokémon Emerald
        run: |
          git clone --depth 1 https://github.com/pret/pokeemerald.git /tmp/pokeemerald-vanilla
          git clone --depth 1 https://github.com/pret/agbcc.git /tmp/agbcc
          cd /tmp/agbcc
          ./build.sh
          ./install.sh /tmp/pokeemerald-vanilla
          make -C /tmp/pokeemerald-vanilla -j"$(nproc)"

      - name: Verify vanilla ROM identity
        run: |
          echo "f3ae088181bf583e55daf962a92bb46f4f1d07b7  /tmp/pokeemerald-vanilla/pokeemerald.gba" | sha1sum -c -

      - name: Build Floating IPS
        run: |
          git clone --depth 1 https://github.com/bates64/flips.git /tmp/flips
          cd /tmp/flips
          TARGET=cli make -j"$(nproc)"

      - name: Create and verify Release and Debug BPS patches
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          RELEASE_PATCH="docs/downloads/Pokemon-Emerald-Legends-v${VERSION}.bps"
          DEBUG_PATCH="docs/downloads/Pokemon-Emerald-Legends-v${VERSION}-debug.bps"

          mkdir -p docs/downloads

          /tmp/flips/flips --create --bps \
            /tmp/pokeemerald-vanilla/pokeemerald.gba \
            pokeemerald-release.gba \
            "$RELEASE_PATCH"

          /tmp/flips/flips --create --bps \
            /tmp/pokeemerald-vanilla/pokeemerald.gba \
            pokeemerald.gba \
            "$DEBUG_PATCH"

          /tmp/flips/flips --apply \
            "$RELEASE_PATCH" \
            /tmp/pokeemerald-vanilla/pokeemerald.gba \
            /tmp/emerald-legends-release-verified.gba

          /tmp/flips/flips --apply \
            "$DEBUG_PATCH" \
            /tmp/pokeemerald-vanilla/pokeemerald.gba \
            /tmp/emerald-legends-debug-verified.gba

          cmp /tmp/emerald-legends-release-verified.gba pokeemerald-release.gba
          cmp /tmp/emerald-legends-debug-verified.gba pokeemerald.gba

          sha256sum "$RELEASE_PATCH" "$DEBUG_PATCH" > docs/downloads/SHA256SUMS.txt
          sha256sum pokeemerald-release.gba pokeemerald.gba >> docs/downloads/SHA256SUMS.txt

      - name: Commit patches to site
        if: github.event_name != 'pull_request'
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          RELEASE_PATCH="Pokemon-Emerald-Legends-v${VERSION}.bps"
          DEBUG_PATCH="Pokemon-Emerald-Legends-v${VERSION}-debug.bps"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep only the current Release and Debug BPS files in the site download slot.
          find docs/downloads -maxdepth 1 -type f -name 'Pokemon-Emerald-Legends-v*.bps' \
            ! -name "$RELEASE_PATCH" \
            ! -name "$DEBUG_PATCH" \
            -delete

          git add -f "docs/downloads/$RELEASE_PATCH" "docs/downloads/$DEBUG_PATCH" docs/downloads/SHA256SUMS.txt
          git add -u docs/downloads

          if git diff --cached --quiet; then
            echo "Release patches are already current."
            exit 0
          fi

          git commit -m "Release: refresh Emerald Legends v${VERSION} Release and Debug patches [skip ci]"
          git pull --rebase origin master
          git push
