name: Build release patches

# One automatic entry point; ROMs and ELFs stay in the private reusable job.
on:
  push:
    branches: [master]
    paths: &verified-inputs
      - '.github/workflows/build-release-patch.yml'
      - '.github/workflows/mgba-gameplay-qa.yml'
      - 'VERSION'
      - 'src/**'
      - 'include/**'
      - 'data/**'
      - 'graphics/**'
      - 'sound/**'
      - 'maps/**'
      - 'scripts/**'
      - 'asm/**'
      - 'Makefile'
      - '*.mk'
      - '*.ld'
      - 'charmap.txt'
      - 'check_history.sh'
      - 'tools/legends/mgba_gameplay_smoke.c'
      - 'tools/legends/native_*/**'
      - 'tools/legends/shared_build.py'
      - 'tools/legends/build_verified_patches.sh'
      - 'tools/legends/verify_bps_with_browser.cjs'
      - 'docs/patcher.js'
      - 'test/mgba-gameplay-smoke.py'
      - 'tools/bin2c/**'
      - 'tools/gbafix/**'
      - 'tools/gbagfx/**'
      - 'tools/jsonproc/**'
      - 'tools/mapjson/**'
      - 'tools/mid2agb/**'
      - 'tools/preproc/**'
      - 'tools/ramscrgen/**'
      - 'tools/rsfont/**'
      - 'tools/scaninc/**'
      - 'tools/trainerproc/**'
      - 'tools/compresSmol/**'
      - 'tools/wav2agb/**'
      - 'tools/wild_encounters/**'
      - 'tools/misc/**'
      - 'tools/learnset_helpers/**'
  pull_request:
    branches: [master]
    paths: *verified-inputs
  workflow_dispatch:
    inputs:
      publish_patches:
        description: Publish after native QA and both independent decoders pass
        type: boolean
        default: true
      compare_serial:
        description: Also run the full serial/parallel seasonal comparison
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: legends-pipeline-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/mgba-gameplay-qa.yml
    permissions:
      contents: read
    with:
      verify_patches: true
      compare_serial: ${{ inputs.compare_serial == true }}

  build-patches:
    needs: verify
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_patches)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout the verified source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_commit }}
          fetch-depth: 1
      - name: Download verified patches and receipts from this run
        uses: actions/download-artifact@v4
        with:
          name: legends-candidate-patches
          path: build/verified-publication
      - name: Publish only verified patches while preserving concurrent bot manifests
        env:
          EXPECTED_MANIFEST: ${{ needs.verify.outputs.manifest_sha256 }}
          EXPECTED_SOURCE: ${{ needs.verify.outputs.source_commit }}
          EXPECTED_FINGERPRINT: ${{ needs.verify.outputs.source_fingerprint }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp tools/legends/shared_build.py "$RUNNER_TEMP/legends-publication-guard.py"
          git fetch origin master
          git rebase origin/master
          check_publication() {
            python3 "$RUNNER_TEMP/legends-publication-guard.py" check-publication \
              --root "$GITHUB_WORKSPACE" --folder build/verified-publication \
              --manifest-sha "$EXPECTED_MANIFEST" --source-commit "$EXPECTED_SOURCE" \
              --source-fingerprint "$EXPECTED_FINGERPRINT"
          }
          check_publication
          game_version="$(tr -d '\r\n' < VERSION)"
          release_patch="Pokemon-Emerald-Legends-v${game_version}.bps"
          debug_patch="Pokemon-Emerald-Legends-v${game_version}-debug.bps"
          mkdir -p docs/downloads
          cp "build/verified-publication/$release_patch" "docs/downloads/$release_patch"
          cp "build/verified-publication/$debug_patch" "docs/downloads/$debug_patch"
          cp build/verified-publication/SHA256SUMS.txt docs/downloads/SHA256SUMS.txt
          find docs/downloads -maxdepth 1 -type f -name 'Pokemon-Emerald-Legends-v*.bps' \
            ! -name "$release_patch" ! -name "$debug_patch" -delete
          git add -f "docs/downloads/$release_patch" "docs/downloads/$debug_patch" docs/downloads/SHA256SUMS.txt
          git add -u docs/downloads
          if git diff --cached --quiet; then
            echo "Release patches are already current; all shared-build publication checks passed."
            exit 0
          fi
          git commit -m "Release: refresh Emerald Legends v${game_version} Release and Debug patches [skip ci]"
          for publish_attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            check_publication
            if git push origin HEAD:master; then exit 0; fi
          done
          echo "::error::Publication failed after three guarded attempts."
          exit 1
