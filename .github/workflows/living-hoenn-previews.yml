name: Legends feature dialogue previews (private QA)

on:
  push:
    branches: [ "qa/v0.0.61-feature-captures" ]
    paths:
      - '.github/workflows/living-hoenn-previews.yml'
      - 'tools/legends/living_hoenn_preview/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install native mGBA, compiler and Pillow
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev libmgba-dev python3-pil g++
      - name: Check private QA ARM instrument source before full ROM build
        run: |
          arm-none-eabi-gcc -iquote include -iquote . -DMODERN=1 -DEMERALD -mthumb -mcpu=arm7tdmi \
            -Werror=implicit-function-declaration -fsyntax-only tools/legends/living_hoenn_preview/arm.c
      - name: Build actual Legends v0.0.61 Debug ROM
        run: make -j"$(nproc)"
      - name: Run private native mGBA scenarios and capture original dialogue
        run: python3 tools/legends/living_hoenn_preview/run.py
      - name: Upload frames, contact sheets and proof (never the private ROM or save)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legends-v0.0.61-real-dialogue-previews
          path: |
            build/living-hoenn-feature-captures/*.png
            build/living-hoenn-feature-captures/*.json
            build/living-hoenn-feature-captures/*.log
          if-no-files-found: warn
