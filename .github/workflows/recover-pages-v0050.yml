name: Recover stale v0.0.50 Pages deployment

on:
  push:
    branches: [master]
    paths: ['.github/workflows/recover-pages-v0050.yml']
  workflow_dispatch:

permissions:
  pages: write

jobs:
  cancel-stale-deployment:
    if: github.repository == 'BabyCRTTV/pokeemerald-emerald-legends'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel only the verified stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Pages run 38594477288 timed out; its stale lock rejected the retry.
          endpoint="repos/BabyCRTTV/pokeemerald-emerald-legends/pages/deployments/491a43c6cf6ad3d581c6ca6b57ee219ccb706a3b"
          gh api --method POST "$endpoint/cancel"
          gh api "$endpoint"
