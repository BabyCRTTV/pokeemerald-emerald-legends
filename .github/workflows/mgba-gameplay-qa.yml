name: Legends mGBA gameplay smoke

on:
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/mgba-gameplay-qa.yml'
      - 'tools/legends/mgba_gameplay_smoke.c'
      - 'test/mgba-gameplay-smoke.py'
      - 'tools/legends/native_living_hoenn_qa/**'
      - 'tools/legends/native_seasonal_encounters_qa/**'
      - 'tools/legends/native_visual_repairs_qa/**'
      - 'src/**'
      - 'include/**'
      - 'data/**'
      - 'graphics/**'
      - 'maps/**'
      - 'VERSION'
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/mgba-gameplay-qa.yml'
      - 'tools/legends/mgba_gameplay_smoke.c'
      - 'test/mgba-gameplay-smoke.py'
      - 'tools/legends/native_living_hoenn_qa/**'
      - 'tools/legends/native_seasonal_encounters_qa/**'
      - 'tools/legends/native_visual_repairs_qa/**'
      - 'src/**'
      - 'include/**'
      - 'data/**'
      - 'graphics/**'
      - 'maps/**'
      - 'VERSION'

permissions:
  contents: read

jobs:
  mgba-debug-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and native mGBA emulator
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi libpng-dev libmgba-dev python3-pil g++
      - name: Build unmodified Legends Debug ROM and ELF
        run: make -j"$(nproc)"
      - name: Execute native mGBA Quickstart and capture live gameplay
        run: python3 test/mgba-gameplay-smoke.py
      - name: Exercise research notes, bulletin and town dialogue branches
        run: python3 tools/legends/native_living_hoenn_qa/run.py
      - name: Exercise seasonal encounter trial and native DexNav silhouettes
        run: python3 tools/legends/native_seasonal_encounters_qa/run.py
      - name: Exercise accepted bedroom repair and wardrobe return/save paths
        run: python3 tools/legends/native_visual_repairs_qa/run.py --output build/visual-repairs-qa --mgba-prefix /usr
      - name: Build unmodified Legends Release ROM and ELF
        run: make -j"$(nproc)" release
      - name: Exercise unmodified Release Continue, both bedrooms and wardrobe returns
        run: python3 tools/legends/native_visual_repairs_qa/release.py --prefix /usr --fixtures build/visual-repairs-qa --output build/bedroom-release-qa
      - name: Upload direct Legends gameplay frames and machine receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legends-mgba-gameplay
          path: |
            build/legends-mgba-preview/*.png
            build/legends-mgba-preview/*.json
            build/legends-mgba-preview/*.log
            build/living-hoenn-qa/*.png
            build/living-hoenn-qa/*.json
            build/living-hoenn-qa/*.log
            build/seasonal-encounters-qa/*.png
            build/seasonal-encounters-qa/*.json
            build/seasonal-encounters-qa/*.log
            build/visual-repairs-qa/*.png
            build/visual-repairs-qa/*.json
            build/visual-repairs-qa/*.log
            build/bedroom-release-qa/**/*.png
            build/bedroom-release-qa/**/*.json
            build/bedroom-release-qa/**/*.log
          if-no-files-found: warn
