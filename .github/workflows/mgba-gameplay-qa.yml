name: Legends mGBA gameplay smoke

on:
  workflow_call:
    inputs:
      compare_serial:
        type: boolean
        default: false
      verify_patches:
        type: boolean
        default: true
    outputs:
      source_commit:
        value: ${{ jobs.mgba-debug-smoke.outputs.source_commit }}
      source_fingerprint:
        value: ${{ jobs.mgba-debug-smoke.outputs.source_fingerprint }}
      manifest_sha256:
        value: ${{ jobs.mgba-debug-smoke.outputs.manifest_sha256 }}
  workflow_dispatch:
    inputs:
      compare_serial:
        description: Compare all serial/parallel cases, captures and timings
        type: boolean
        default: false
      verify_patches:
        description: Also verify both patches against the canonical base
        type: boolean
        default: true

permissions:
  contents: read

# Superseded PR runs are obsolete; every master commit keeps its own gate.
concurrency:
  group: legends-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mgba-debug-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      source_commit: ${{ steps.shared.outputs.source_commit }}
      source_fingerprint: ${{ steps.shared.outputs.source_fingerprint }}
      manifest_sha256: ${{ steps.shared.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install compiler and native mGBA emulator
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi libpng-dev libmgba-dev python3-pil g++ git
      - name: Build unmodified Legends Debug ROM and ELF
        run: make -j"$(nproc)"
      - name: Build unmodified Legends Release ROM and ELF
        run: make -j"$(nproc)" release
      - name: Record the private shared build identities
        run: python3 tools/legends/shared_build.py record
      - name: Start canonical-base and dual-decoder verification alongside native QA
        id: patch_start
        if: inputs.verify_patches
        run: python3 tools/legends/shared_build.py start
      - name: Execute native mGBA Quickstart and capture live gameplay
        run: python3 test/mgba-gameplay-smoke.py
      - name: Exercise native dual Eon battles and legacy/current flash persistence
        run: python3 tools/legends/native_eon_roamers_qa/run.py
      - name: Exercise native Ember boat return, walking and reboarding
        run: python3 tools/legends/native_ember_return_qa/run.py
      - name: Exercise unshipped grotto review maps and seasonal visitors
        run: python3 tools/legends/native_grotto_review/run.py
      - name: Exercise grotto battles, exact cooldowns and native flash saves
        run: python3 tools/legends/native_grotto_encounters/run.py
      - name: Exercise research notes, bulletin and town dialogue branches
        run: python3 tools/legends/native_living_hoenn_qa/run.py
      - name: Exercise seasonal encounter trial and native DexNav silhouettes
        env:
          COMPARE_SEASONAL_SERIAL: ${{ inputs.compare_serial == true || contains(github.event.head_commit.message, '[benchmark seasonal QA]') }}
        run: |
          seasonal_args=()
          if [ "$COMPARE_SEASONAL_SERIAL" = "true" ]; then
            seasonal_args+=(--compare-serial)
          fi
          python3 tools/legends/native_seasonal_encounters_qa/run.py "${seasonal_args[@]}"
      - name: Exercise accepted bedroom repair and wardrobe return/save paths
        run: python3 tools/legends/native_visual_repairs_qa/run.py --output build/visual-repairs-qa --mgba-prefix /usr
      - name: Exercise normal Release Continue with independent Eon state fixtures
        run: python3 tools/legends/native_eon_roamers_qa/release.py
      - name: Exercise native Release Ember boat return, walking and reboarding
        run: python3 tools/legends/native_ember_return_qa/release.py
      - name: Exercise normal Release Continue with grotto battery fixtures
        run: python3 tools/legends/native_grotto_encounters/release.py
      - name: Exercise unmodified Release Continue, both bedrooms and wardrobe returns
        run: python3 tools/legends/native_visual_repairs_qa/release.py --prefix /usr --fixtures build/visual-repairs-qa --output build/bedroom-release-qa
      - name: Join canonical-base and patch verification
        if: ${{ always() && !cancelled() && steps.patch_start.outcome == 'success' }}
        run: python3 tools/legends/shared_build.py join
      - name: Bind native and decoder receipts to the same private builds
        id: shared
        env:
          VERIFY_PATCHES: ${{ inputs.verify_patches }}
        run: |
          shared_args=()
          if [ "$VERIFY_PATCHES" != "true" ]; then shared_args+=(--without-patches); fi
          python3 tools/legends/shared_build.py finalize "${shared_args[@]}"
      - name: Upload direct Legends gameplay frames and machine receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legends-mgba-gameplay
          path: |
            build/shared-build/*.json
            build/shared-build/*.log
            build/eon-roamers-qa/*.png
            build/eon-roamers-qa/*.json
            build/eon-roamers-qa/*.log
            build/eon-roamers-release-qa/*.png
            build/eon-roamers-release-qa/*.json
            build/eon-roamers-release-qa/*.log
            build/ember-return-qa/*.png
            build/ember-return-qa/*.json
            build/ember-return-qa/*.log
            build/ember-return-release-qa/**/*.png
            build/ember-return-release-qa/**/*.json
            build/ember-return-release-qa/**/*.log
            build/legends-mgba-preview/*.png
            build/legends-mgba-preview/*.json
            build/legends-mgba-preview/*.log
            build/grotto-encounters/*.png
            build/grotto-encounters/verification.json
            build/grotto-encounters-release/verification.json
            build/grotto-encounters-release/*.png
            build/grotto-encounters-release/*.log
            build/grotto-encounters/*.log
            build/grotto-review/*.png
            build/grotto-review/*.json
            build/grotto-review/*.log
            build/living-hoenn-qa/*.png
            build/living-hoenn-qa/*.json
            build/living-hoenn-qa/*.log
            build/seasonal-encounters-qa/*.png
            build/seasonal-encounters-qa/*.json
            build/seasonal-encounters-qa/*.log
            build/seasonal-encounters-qa/parallel/**/*.log
            build/seasonal-encounters-qa/parallel/**/*.json
            build/seasonal-encounters-qa/serial-reference/**/*.log
            build/seasonal-encounters-qa/serial-reference/**/*.json
            build/seasonal-encounters-qa/serial-reference/*.png
            build/visual-repairs-qa/*.png
            build/visual-repairs-qa/*.json
            build/visual-repairs-qa/*.log
            build/bedroom-release-qa/**/*.png
            build/bedroom-release-qa/**/*.json
            build/bedroom-release-qa/**/*.log
          if-no-files-found: warn
      - name: Retain patches and receipts only, never ROM or ELF files
        if: inputs.verify_patches
        uses: actions/upload-artifact@v4
        with:
          name: legends-candidate-patches
          path: build/shared-build/publication/
          if-no-files-found: error
