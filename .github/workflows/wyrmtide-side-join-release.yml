name: Wyrmtide stair-bank Release verification
on:
  push:
    branches: [ codex/wyrmtide-isle ]
    paths: [ '.github/workflows/wyrmtide-side-join-release.yml' ]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the standard Release compiler
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev g++ python3-pil
      - name: Build the unmodified Release target with standard LTO
        run: make -j"$(nproc)" release > release-build.log 2>&1
      - name: Record committed source and Release ROM identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          paths=['data/layouts/LegendsWyrmtide_Descent'+str(i)+'/map.bin' for i in range(1,5)]
          def blob(p):
              b=Path(p).read_bytes()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          proof={'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'build':'Release','command':'make -j$(nproc) release','standardLTO':True,'ROM_sha256':hashlib.sha256(Path('pokeemerald-release.gba').read_bytes()).hexdigest(),'mapBlobs':{p:blob(p) for p in paths},'passed':True}
          Path('release-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          print('SIDE_JOIN_RELEASE '+json.dumps(proof))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wyrmtide-side-join-release-proof
          path: |
            release-build.log
            release-proof.json
