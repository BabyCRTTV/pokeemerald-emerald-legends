name: Build Legends Wiki Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'android/wiki/**'
      - '.github/workflows/wiki-apk.yml'

permissions:
  contents: write

concurrency:
  group: legends-wiki-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wiki:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout wiki companion sources
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate public wiki sources
        run: |
          node --check docs/wiki/wiki.js
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          p = json.loads(Path('docs/wiki/articles.json').read_text())
          ids = [a['id'] for a in p['articles']]
          assert len(ids) == len(set(ids)), 'duplicate wiki article IDs'
          for article in p['articles']:
              for target in re.findall(r'\[\[([a-z0-9-]+)\|', article['content']):
                  assert target in ids, f"{article['id']}: broken internal link to {target}"
          print(f"Validated {len(ids)} articles and their internal references")
          PY

      - name: Compile signed installable Android APK
        run: gradle --project-dir android/wiki :app:assembleDebug --no-daemon

      - name: Check installable APK
        run: |
          APK=android/wiki/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          sha256sum "$APK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: emerald-legends-wiki-apk
          path: android/wiki/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish standalone APK to project website
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p docs/downloads
          cp android/wiki/app/build/outputs/apk/debug/app-debug.apk docs/downloads/Emerald-Legends-Wiki.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/downloads/Emerald-Legends-Wiki.apk
          if git diff --cached --quiet; then
            echo "Wiki APK unchanged."
            exit 0
          fi
          git commit -m "Wiki: publish Android companion APK [skip ci]"
          git pull --rebase origin master
          git push
