# Upstream pokeemerald-expansion documentation workflow.
#
# Pokémon Emerald: Legends publishes its project website directly from
# master:/docs via GitHub Pages. Automatic mdBook deployment is disabled here
# because GitHub Pages supports one publishing source at a time and this
# workflow conflicts with the Legends site deployment.
#
# Keep the workflow available for an explicit manual documentation build if
# upstream documentation needs to be checked later.

name: Docs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install latest mdbook
        run: |
          tag="v0.5.1"
          url="https://github.com/rust-lang/mdbook/releases/download/${tag}/mdbook-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir mdbook
          curl -sSL $url | tar -xz --directory=./mdbook
          echo `pwd`/mdbook >> $GITHUB_PATH
      - name: Build Book
        run: |
          cd docs
          mdbook build
