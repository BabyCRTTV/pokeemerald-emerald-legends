name: Wyrmtide stairwell Release review
on:
  push:
    branches: [codex/wyrmtide-isle]
    paths: [.github/workflows/wyrmtide-stairwell-release.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install standard compiler
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev g++
      - name: Build standard Release with default LTO
        run: make -j"$(nproc)" release > release-build.log 2>&1
      - name: Record Release proof
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          rom=Path('pokeemerald-release.gba')
          inputs=['data/tilesets/legends_wyrmtide/metatiles.bin','data/tilesets/legends_wyrmtide/metatile_attributes.bin','data/tilesets/legends_wyrmtide/source.json']+[f'data/{kind}/LegendsWyrmtide_Descent{i}/'+('map.bin' if kind=='layouts' else 'map.json') for kind in ['layouts','maps'] for i in range(1,5)]
          proof={'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'standardRelease':True,'defaultLTO':True,'ROM_sha256':hashlib.sha256(rom.read_bytes()).hexdigest(),'inputs':{p:subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip() for p in inputs}}
          Path('release-proof.json').write_text(json.dumps(proof,indent=2)+'\n');print(json.dumps(proof))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wyrmtide-stairwell-release-proof
          path: |
            release-proof.json
            release-build.log
