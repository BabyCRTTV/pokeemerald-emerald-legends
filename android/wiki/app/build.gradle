plugins {
    id 'com.android.application'
}

android {
    namespace 'com.babycrttv.emeraldlegendswiki'
    compileSdk 35

    defaultConfig {
        applicationId 'com.babycrttv.emeraldlegendswiki'
        minSdk 26
        targetSdk 34
        versionCode (project.findProperty('wikiVersionCode') ?: '1').toInteger()
        versionName (project.findProperty('wikiVersionName') ?: '1.0.0').toString()
    }

    signingConfigs {
        wikiRelease {
            if (System.getenv('WIKI_KEYSTORE_PATH')) {
                storeFile file(System.getenv('WIKI_KEYSTORE_PATH'))
                storePassword System.getenv('WIKI_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('WIKI_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('WIKI_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('WIKI_KEYSTORE_PATH')) {
                signingConfig signingConfigs.wikiRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
